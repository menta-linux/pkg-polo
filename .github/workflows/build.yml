name: Build Debian packages

on:
  push:
    branches: [master]
    tags: ['menta/*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: debian:unstable
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils quilt jq gh meson ninja-build devscripts equivs build-essential fakeroot

      - uses: actions/checkout@v4

      - name: Fetch upstream commit
        run: |
          # version looks like 1.0.1+git20261113.1154525-1menta1 -> commit 1154525
          UPSTREAM=$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')
          COMMIT=${UPSTREAM##*.}
          mkdir -p ../build
          git clone https://github.com/KeremSoke/polo.git "../build/polo-${UPSTREAM}"
          cd "../build/polo-${UPSTREAM}"
          git checkout "$COMMIT"
          # the patched Weston is a meson wrap: vendor it into the orig tarball
          meson subprojects download
          rm -rf .git subprojects/weston/.git
          cd ..
          tar cJf "polo_${UPSTREAM}.orig.tar.xz" "polo-${UPSTREAM}"
          cp -a "$GITHUB_WORKSPACE/debian" "polo-${UPSTREAM}/"
          echo "SRCDIR=$(realpath polo-${UPSTREAM})" >> "$GITHUB_ENV"

      - name: Apply quilt patches
        working-directory: ${{ env.SRCDIR }}
        run: |
          export QUILT_PATCHES=debian/patches
          if [ -s debian/patches/series ]; then quilt push -a; fi

      - name: Install Menta dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          {
            mkdir -p /tmp/menta-debs
            for r in mate-desktop; do
              gh release download latest -R "menta-linux/pkg-$r" -p '*.deb' -D /tmp/menta-debs --clobber
            done
            rm -f /tmp/menta-debs/*dbgsym*.deb
            apt-get install -y /tmp/menta-debs/*.deb
          } 2>&1 | tee /tmp/menta.log

      - name: Install build dependencies
        working-directory: ${{ env.SRCDIR }}
        run: |
          set -o pipefail
          (mk-build-deps debian/control && apt-get install -y --no-install-recommends ./*-build-deps_*.deb) 2>&1 | tee /tmp/deps.log

      - name: Build
        working-directory: ${{ env.SRCDIR }}
        run: |
          set -o pipefail
          dpkg-buildpackage -us -uc -b 2>&1 | tee /tmp/build.log

      - name: Report failure
        if: failure()
        run: |
          for f in /tmp/menta.log /tmp/deps.log /tmp/build.log; do
            [ -f "$f" ] || continue
            msg=$( { grep -E '^E:|unmet|Unable|not installable|Depends:|but it is|error:|Error ' "$f" | head -15; echo ----; tail -n 30 "$f"; } | cut -c1-220 | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$(basename "$f")::$msg"
          done

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -v ../build/*.deb ../build/*.buildinfo ../build/*.changes "$GITHUB_WORKSPACE/artifacts/"

      - uses: actions/upload-artifact@v4
        with:
          name: polo-debs
          path: artifacts/*

      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create latest artifacts/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "latest" --notes "Rolling build of $GITHUB_SHA"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/menta/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* -R "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME}" --notes "Build of $GITHUB_SHA"
